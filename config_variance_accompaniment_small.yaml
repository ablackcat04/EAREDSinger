binary_data_dir: data/opencpop_normalized_accompaniment/binary
binarization_args:
  num_workers: 0
pe: rmvpe
pe_ckpt: 'checkpoints/rmvpe/model.pt'
hnsep: vr
hnsep_ckpt: 'checkpoints/vr/model.pt'
vocoder: NsfHifiGAN
vocoder_ckpt: checkpoints/nsf_hifigan_44.1k_hop512_128bin_2024.02/model.ckpt

use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1

# NOTICE: before enabling variance embeddings, please read the docs at
# https://github.com/openvpi/DiffSinger/tree/main/docs/BestPractices.md#choosing-variance-parameters
use_energy_embed: false
use_breathiness_embed: true
use_voicing_embed: true
use_tension_embed: true

use_accompaniment: true

accompaniment_num_mel_bins: 128
accompaniment_mel_fmin: 40
accompaniment_mel_fmax: 16000
accompaniment_mel_hop_size: 512
accompaniment_mel_win_size: 2048
accompaniment_mel_fft_size: 2048

use_key_shift_embed: true
use_speed_embed: true

augmentation_args:
  random_pitch_shifting:
    enabled: true
    range: [-5., 5.]
    scale: 0.75
  fixed_pitch_shifting:
    enabled: false
    targets: [-5., 5.]
    scale: 0.5
  random_time_stretching:
    enabled: true
    range: [0.5, 2.]
    scale: 0.75

# diffusion and shallow diffusion
diffusion_type: reflow
enc_ffn_kernel_size: 3
use_rope: true
rope_interleaved: false
use_shallow_diffusion: false
T_start: 0.0
T_start_infer: 0.0
K_step: 300
K_step_infer: 300
backbone_type: 'lynxnet'
backbone_args:
  num_channels: 1024
  num_layers: 6
  kernel_size: 31
  dropout_rate: 0.0
  strong_cond: true
#backbone_type: 'wavenet'
#backbone_args:
#  num_channels: 512
#  num_layers: 20
#  dilation_cycle_length: 4


optimizer_args:
  lr: 0.0006
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.StepLR
  step_size: 10000
  gamma: 0.75
max_batch_frames: 8000
max_batch_size: 4
max_updates: 160000

num_valid_plots: 3
val_with_vocoder: true
val_check_interval: 200
num_ckpt_keep: 5
permanent_ckpt_start: 120000
permanent_ckpt_interval: 20000
pl_trainer_devices: 'auto'
pl_trainer_precision: '16-mixed'
