base_config:
  - config_variance_accompaniment_small.yaml

# Stage 2 uses a frozen variance model that was trained without accompaniment.
task_cls: training.tension_refiner_task.TensionRefinerTask
use_accompaniment: false
base_variance_ckpt: null  # Fill with the server checkpoint path before preparation.
base_binary_data_dir: data/opencpop_normalized_accompaniment/binary

# Song-level refiner data generated by scripts/prepare_tension_refiner.py.
binary_data_dir: data/opencpop_tension_refiner/binary
refiner_accompaniment_dir: 'C:/Users/wuru8/Desktop/diffsinger/opencpop/accompliments/accomp_nor'
refiner_textgrid_dir: 'C:/Users/wuru8/Desktop/diffsinger/opencpop/textgrids'
refiner_sentence_tier: '句子'
refiner_prediction_seed: 1234

# The refiner sees one full song at 16x lower temporal resolution and predicts
# an additive tension residual. Its output layer starts at zero (identity).
refiner_downsample_factor: 16
refiner_hidden_size: 256
refiner_num_layers: 8
refiner_kernel_size: 5
refiner_dropout: 0.1
refiner_initial_gate: 0.1

lambda_refiner_delta: 0.001
lambda_refiner_smooth: 0.01

optimizer_args:
  lr: 0.0002
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.StepLR
  step_size: 20000
  gamma: 0.75

# Each example is a complete song. Keep batch size at one unless memory has
# been measured with the target GPU.
max_batch_frames: 40000
max_batch_size: 1
max_val_batch_frames: 40000
max_val_batch_size: 1
max_updates: 80000
val_check_interval: 500
num_valid_plots: 3
ds_workers: 1
